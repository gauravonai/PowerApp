               Type: If(t = "ISSUE", "RELEASE", t), RawType: t, Qty: q,
               SQty: Switch(t, "RECEIPT", q, "RETURN", q, "ADJUST+", q, "ISSUE", -q, "SCRAP", -q, "ADJUST-", -q, 0),
