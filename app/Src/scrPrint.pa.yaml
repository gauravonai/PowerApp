                        Fill: =RGBA(255,255,255,0.08)
                        FocusedBorderColor: =cJcb
                        FocusedBorderThickness: =2
                        Font: =fUI
                        FontWeight: =FontWeight.Bold
                        Height: =32
                        HoverBorderColor: =cJcb
                        HoverColor: =cJcb
                        HoverFill: =cJcbWash
                        OnSelect: =If(gPrintKind = "cost", Navigate(scrCost, ScreenTransition.None), Navigate(scrInvList, ScreenTransition.None))
                        PaddingLeft: =8
                        PaddingRight: =8
                        PressedBorderColor: =cJcb
                        PressedColor: =cJcb
                        PressedFill: =cJcbWash
