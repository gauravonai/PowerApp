eight:bold;text-align:right;'>" & "Cost (B×C)" & "</td>" & "</tr>" & If(CountRows(Filter(nfLines, RequestNo = LookUp(nfInv, InvoiceNo = gInvEdit).RefRequest)) = 0, "<tr><td colspan='5' style='border:1px solid #8A8A8A;padding:4px;text-align:center'>— material cost " & Text(LookUp(nfInv, InvoiceNo = gInvEdit).MaterialCost, "#,##0.00") & " (lines not stored) —</td></tr>", Concat(Filter(nfLines, RequestNo = LookUp(nfInv, InvoiceNo = gInvEdit).RefRequest), "<tr>" & "<td style='border:1px solid #8A8A8A;padding:4px 6px;text-align:center'>" & Text(Sr) & "</td>" & "<td style='border:1px solid #8A8A8A;padding:4px 6px;'>" & PartNo & "</td>" & "<td style='border:1px solid #8A8A8A;padding:4px 6px;text-align:right;'>" & Text(If(QtyReleased > 0, QtyReleased, QtyRequested), "#,##0") & "</td>" & "<td style='border:1px solid #8A8A8A;padding:4px 6px;text-align:right;'>" & Text(UnitCost, "#,##0.00") & "</td>" & "<td style='border:1px solid #8A8A8A;padding:4px 6px;text-align:right;'>" & Text(If(QtyReleased > 0, QtyReleased, QtyRequested) * UnitCost, "#,##0.00") & "</td>" & "</tr>")) & "</table>" & "<table style='width:100%;border-collapse:collapse;margin-top:10px'>" & "<tr>" & "<td colspan='2' style='border:1px solid #8A8A8A;padding:4px 6px;background:#22B14C;color:#fff;font-weight:bold;text-align:center;'>" & "Description" & "</td>" & "</tr>" & "<tr>" & "<td style='border:1px solid #8A8A8A;padding:4px 6px;'>" & "Harness Assembly" & "</td>" & "<td style='border:1px solid #8A8A8A;padding:4px 6px;text-align:right;width:180px'>" & Text(LookUp(nfInv, InvoiceNo = gInvEdit).AssemblyCost, "#,##0.00") & "</td>" & "</tr>" & "<tr>" & "<td style='border:1px solid #8A8A8A;padding:4px 6px;'>" & "BOM COST" & "</td>" & "<td style='border:1px solid #8A8A8A;padding:4px 6px;text-align:right;'>" & Text(LookUp(nfInv, InvoiceNo = gInvEdit).MaterialCost, "#,##0.00") & "</td>" & "</tr>" & "<tr>" & "<td style='border:1px solid #8A8A8A;padding:4px 6px;background:#E8A33D;font-weight:bold;'>" & "Transport Cost" & "</td>" & "<td style='border:1px solid #8A8A8A;padding:4px 6px;background:#E8A33D;font-weight:bold;text-align:right;'>" & Text(LookUp(nfInv, InvoiceNo = gInvEdit).TransportCost, "#,##0.00") & "</td>" & "</tr>" & "<tr>" & "<td style='border:1px solid #8A8A8A;padding:4px 6px;background:#7A6B3A;color:#fff;font-weight:bold;'>" & "Total Cost (INR)" & "</td>" & "<td style='border:1px solid #8A8A8A;padding:4px 6px;background:#7A6B3A;color:#fff;font-weight:bold;text-align:right;'>" & Text(LookUp(nfInv, InvoiceNo = gInvEdit).TotalCost, "#,##0.00") & "</td>" & "</tr>" & "</table>" & "<p style='margin:12px 0 0;font-weight:bold;background:#CDE3F0;border:1px solid #8A8A8A;padding:4px;text-align:center'>Harness label Images</p></div>", "<div style='font-family:Calibri,Segoe UI,Arial,sans-serif;font-size:12px;color:#000;background:#fff'><p style='font-size:17px;font-weight:bold;margin:0 0 3px'>Harness Assembly Cost — Assumptions</p><p style='font-size:11px;color:#444;margin:0 0 8px'>JCB India · EDS Lab · " & "Job " & Coalesce(gCostReq, "—") & " · Harness " & Coalesce(LookUp(nfReq, RequestNo = gCostReq).HarnessPartNo, "—") & " · " & Text(Today(), "dd-mmm-yyyy") & "</p>" & "<table style='width:100%;border-collapse:collapse;margin-top:10px'>" & "<tr>" & "<td colspan='6' style='border:1px solid #8A8A8A;padding:4px 6px;background:#22B14C;color:#fff;font-weight:bold;text-align:center;'>" & "Assumptions" & "</td>" & "</tr>" & "<tr>" & "<td colspan='2' style='border:1px solid #8A8A8A;padding:4px 6px;background:#E8A33D;font-weight:bold;'>" & "Cost of Machine / Per hr rate" & "</td>" & "<td style='border:1px solid #8A8A8A;padding:4px 6px;background:#E8A33D;font-weight:bold;'>" & "" & "</td>" & "<td colspan='2' style='border:1px solid #8A8A8A;padding:4px 6px;background:#E8A33D;font-weight:bold;'>" & "Inputs" & "</td>" & "<td style='border:1px solid #8A8A8A;padding:4px 6px;background:#E8A33D;font-weight:bold;'>" & "" & "</td>" & "</tr>" & "<tr>" & "<td colspan='2' style='border:1px solid #8A